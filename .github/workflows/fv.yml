name: fv
on:
  push:
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: lake build (zero sorry enforced)
        working-directory: lean
        run: |
          lake build
          # DoD gate: fail only if a `sorry`/`admit` appears in PROOF POSITION
          # (term `:= sorry`, tactic `by sorry`, or a line that is just `sorry`).
          # The word also legitimately appears in prose/docstrings, so we do NOT
          # match bare occurrences — only the syntactic proof-hole forms.
          ! grep -rnE ':=[[:space:]]*sorry\b|\bby[[:space:]]+sorry\b|^[[:space:]]*sorry[[:space:]]*$|\badmit\b' Split Split.lean
      - name: axiom footprint (no sorryAx; oracle-independence axiom-free)
        working-directory: lean
        run: |
          lake env lean scripts/print_axioms.lean | tee axioms.txt
          # 1. No proof hole: sorryAx must never appear in any theorem's axiom set.
          ! grep -q 'sorryAx' axioms.txt
          # 2. Load-bearing claim: oracle independence depends on NO axioms (both vaults).
          grep -q "'Split.T_OracleIndependence' does not depend on any axioms" axioms.txt
          grep -q "'Split.Put.T_OracleIndependence' does not depend on any axioms" axioms.txt
          # 3. The only axioms permitted anywhere are Lean's standard propext / Quot.sound.
          #    Flatten every [..] axiom list to one token per line and fail on anything else.
          UNEXPECTED=$(grep -oE '\[[^]]*\]' axioms.txt | tr ',[]' '\n\n\n' | sed 's/ //g' \
            | grep -vE '^(propext|Quot\.sound)?$' || true)
          if [ -n "$UNEXPECTED" ]; then echo "Unexpected axioms found:"; echo "$UNEXPECTED"; exit 1; fi
          echo "Axiom footprint OK: only propext / Quot.sound; oracle-independence axiom-free; no sorryAx."

  vyper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: compile + property tests
        working-directory: vyper
        run: |
          pip install -r requirements.txt
          vyper SplitVaultReference.vy
          vyper PutVaultReference.vy
          python -m pytest tests -q

  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: stateful invariants + fuzz
        working-directory: conformance/foundry
        run: forge test -vvv

  halmos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Pin halmos + z3 to the versions the green local run used; the heaviest
      # nonlinear (q·strike) check sits near the per-assertion budget, so the
      # slower CI runner needs the larger timeout set in halmos.toml.
      - name: symbolic checks
        working-directory: conformance/halmos
        run: |
          pip install halmos==0.3.3 z3-solver==4.12.6.0
          halmos
